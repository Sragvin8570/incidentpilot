id: scale_deployment
risk_level: medium
applies_to_kinds:
  - Deployment
stabilization_seconds: 30
alert_grace_seconds: 40
recovery_promql: kube_deployment_status_replicas_available{namespace=__NAMESPACE__,deployment=__NAME__}
recovery_threshold: desired_replicas
recovery_operator: ">="
parameters:
  type: object
  additionalProperties: false
  required: [namespace, name, replicas]
  properties:
    namespace:
      type: string
      minLength: 1
      maxLength: 63
      pattern: "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$"
    name:
      type: string
      minLength: 1
      maxLength: 253
      pattern: "^[a-z0-9]([-a-z0-9.]*[a-z0-9])?$"
    replicas:
      type: integer
      minimum: 1
bounds:
  maximum_increase: 3
  direction: increase_only
